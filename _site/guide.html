<!doctype html>
<html lang="en">
    
<head>
     <meta charset="UTF-8">
     <meta name="viewport" 
           content="width=device-width, 
           user-scalable=no, 
           initial-scale=1.0, 
           maximum-scale=1.0, 
           minimum-scale=1.0">
     <meta http-equiv="X-UA-Compatible" 
           content="ie=edge">
         <link rel="stylesheet" href="css/css.css">
             <script type="module" src="js/is-land.js"></script>
             
             
     <title></title>
</head>
<body>
<h1>Welcome to 11ty!!!</h1>
    

<main>
    <h1>My Tech Issue Guide</h1>
    <is-land on:visible>
        
        <div id="counters">
            <div v-scope="Counter({ initialCount: 5 })">
                <p>Count: <span v-text="count"></span></p>
                <button @click="increment">+</button>
            </div>
            <div v-scope="Counter({ initialCount: 20 })">
                <p>Count: <span v-text="count"></span></p>
                <button @click="increment">+</button>
            </div>
        </div>
        
        <template data-island>
            <script type="module">
                import { createApp } from './js/petite-vue.js'
                
                function Counter(props) {
                return {
                count: props.initialCount,
                increment() { this.count++ }
                }
                }
                
                createApp({ Counter }).mount('#counters')
            </script>
        </template>
        
    </is-land>
</main>
    
</body>
</html>
